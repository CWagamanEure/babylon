[project]
name = "babylon"
version = "0.1.0"
description = "Quantitative trading system for Hyperliquid — programmatic + discretionary execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "boto3>=1.34",
    "lz4>=4.3",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "polars>=0.20",
    "pyarrow>=15.0",
    "hyperliquid-python-sdk>=0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
babylon = "babylon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babylon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# typer requires Option(...) calls in argument defaults — that's the idiom.
"src/babylon/cli.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# repo root on sys.path so research/ (incl. research/markout_study/) imports in tests (not installed packages)
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Third-party libraries without type stubs / py.typed markers.
module = ["boto3.*", "botocore.*", "lz4.*"]
ignore_missing_imports = true
